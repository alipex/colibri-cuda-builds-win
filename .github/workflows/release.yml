name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "sm_61"
            arch_name: "win-cuda-pascal-gtx10"
          - cuda_arch: "sm_70"
            arch_name: "win-cuda-volta-v100"
          - cuda_arch: "sm_75"
            arch_name: "win-cuda-turing-rtx20"
          - cuda_arch: "sm_80"
            arch_name: "win-cuda-ampere-a100"
          - cuda_arch: "sm_86"
            arch_name: "win-cuda-ampere-rtx30"
          - cuda_arch: "sm_89"
            arch_name: "win-cuda-ada-rtx40"
          - cuda_arch: "sm_120"
            arch_name: "win-cuda-blackwell-rtx50"

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Host Compiler for nvcc)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Setup w64devkit
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v2.0.0/w64devkit-2.0.0.zip" -OutFile "w64devkit.zip"
          Expand-Archive -Path "w64devkit.zip" -DestinationPath "C:\"
          echo "C:\w64devkit\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build CUDA Backend & Engines
        shell: cmd
        run: |
          cd c
          
          :: Build CUDA DLL overriding nvcc host compiler version check
          make cuda-dll CUDA_ARCH=${{ matrix.cuda_arch }} NVCC="nvcc -allow-unsupported-compiler"
          
          :: Build engines linked with CUDA loader
          for %%t in (colibri inkling kimi_k3 olmoe qwen36) do (
            make %%t.exe CUDA_DLL=1 ARCH=x86-64-v3
          )
          
          :: Build DeepSeek V4 engine
          make deepseek-v4 CUDA_DLL=1 ARCH=x86-64-v3
          
          dir *.exe coli_cuda.dll

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          ls -lh dist/index.html dist/experts.json

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          
          cp c/colibri.exe dist/colibri.exe
          cp c/inkling.exe dist/inkling.exe
          cp c/kimi_k3.exe dist/kimi_k3.exe
          cp c/olmoe.exe dist/olmoe.exe
          cp c/qwen36.exe dist/qwen36.exe
          cp c/deepseek_v4.exe dist/deepseek_v4.exe
          cp c/coli_cuda.dll dist/coli_cuda.dll

          mkdir -p dist/tools
          cp c/tools/k3_tokenizer.py dist/tools/
          cp c/coli dist/
          cp c/version.py dist/
          cp c/openai_server.py dist/
          cp c/v4_dsml.py dist/
          cp c/family_registry.py dist/
          cp c/resource_plan.py dist/
          cp c/doctor.py dist/
          cp c/autotune.py dist/
          cp LICENSE dist/
          
          mkdir -p dist/web
          cp -r web/dist dist/web/dist
          
          cd dist
          7z a colibri-${TAG}-${{ matrix.arch_name }}.zip *

      - name: Verify Package
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p verify && cd verify
          7z x ../dist/colibri-${TAG}-${{ matrix.arch_name }}.zip > /dev/null
          
          test -x colibri.exe || { echo "engine missing"; exit 1; }
          test -f coli_cuda.dll || { echo "FAIL: coli_cuda.dll missing"; exit 1; }

          SIBLINGS="inkling kimi_k3 olmoe qwen36 deepseek_v4"
          for e in $SIBLINGS; do
            test -x $e.exe || { echo "FAIL: $e missing"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: colibri-${{ matrix.arch_name }}
          path: dist/colibri-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          (cd artifacts && sha256sum colibri-*) > artifacts/SHA256SUMS.txt

          NOTES=$(awk "/^## \\[${TAG#v}\\]/{found=1;next} /^## \\[/{if(found)exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "colibri ${TAG}" \
              --notes "$NOTES"
          fi
