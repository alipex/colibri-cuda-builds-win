name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "sm_61"
            arch_name: "win-cuda-pascal-gtx10"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Build Qwen 3.6 Engine & CUDA Backend (Cross-Compile for Windows)
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          export CUDA_HOME="/usr/local/cuda"

          cd c
          
          # Cross-compile CUDA DLL explicitly for Windows OS target
          make cuda-dll \
            CUDA_ARCH=${{ matrix.cuda_arch }} \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            NVCC="/usr/local/cuda/bin/nvcc -target-os-variant Windows -ccbin x86_64-w64-mingw32-g++" || \
          make cuda-dll \
            CUDA_ARCH=${{ matrix.cuda_arch }} \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            NVCC="/usr/local/cuda/bin/nvcc -ccbin x86_64-w64-mingw32-g++"
          
          # Cross-compile Qwen 3.6 executable for Windows target
          make qwen36.exe \
            CUDA_DLL=1 \
            ARCH=x86-64-v3 \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++
          
          ls -lh qwen36.exe coli_cuda.dll

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard
        run: |
          if [ -d "web" ] && [ -f "web/package.json" ]; then
            cd web
            npm ci
            npm run build
          fi

      - name: Package Release
        run: |
          # Resolve tag name safely for workflow_dispatch or tag pushes
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="latest"
          fi

          mkdir -p dist
          
          # Copy core engine and CUDA runtime binaries
          cp c/qwen36.exe dist/
          cp c/coli_cuda.dll dist/

          # Copy core Python tools & support files safely without failing on missing items
          mkdir -p dist/tools
          cp -f c/tools/*.py dist/tools/ 2>/dev/null || true
          cp -f c/coli dist/ 2>/dev/null || true
          cp -f c/*.py dist/ 2>/dev/null || true
          cp -f LICENSE dist/ 2>/dev/null || true
          
          # Copy Web Dashboard Assets if built
          if [ -d "web/dist" ]; then
            mkdir -p dist/web
            cp -r web/dist dist/web/dist
          fi
          
          # Create archive
          cd dist
          7z a colibri-qwen36-${TAG}-${{ matrix.arch_name }}.zip *

      - name: Verify Package Contents
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="latest"
          fi

          mkdir -p verify && cd verify
          7z x ../dist/colibri-qwen36-${TAG}-${{ matrix.arch_name }}.zip > /dev/null
          
          test -f qwen36.exe || { echo "FAIL: qwen36.exe missing from package"; exit 1; }
          test -f coli_cuda.dll || { echo "FAIL: coli_cuda.dll missing from package"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: colibri-qwen36-${{ matrix.arch_name }}
          path: dist/colibri-qwen36-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          (cd artifacts && sha256sum colibri-qwen36-*) > artifacts/SHA256SUMS.txt

          NOTES="Release ${TAG} (Qwen 3.6 Engine)"
          if [ -f CHANGELOG.md ]; then
            EXTRACTED=$(awk "/^## \\[${TAG#v}\\]/{found=1;next} /^## \\[/{if(found)exit} found{print}" CHANGELOG.md)
            if [ -n "$EXTRACTED" ]; then
              NOTES="$EXTRACTED"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "colibri ${TAG} (Qwen 3.6 Engine)" \
              --notes "$NOTES"
          fi
