name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - cuda_arch: "sm_80"
            arch_name: "win-cuda-ampere-a100"
          - cuda_arch: "sm_86"
            arch_name: "win-cuda-ampere-rtx30"
          - cuda_arch: "sm_89"
            arch_name: "win-cuda-ada-rtx40"
          - cuda_arch: "sm_120"
            arch_name: "win-cuda-blackwell-rtx50"

    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Host Compiler for nvcc)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit via Chocolatey
        run: |
          choco install cuda --version=12.8.0.20250128 -y --no-progress
        shell: pwsh

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build CUDA DLL & Engines
        run: |
          # Inject nvcc into MSYS2 PATH
          export PATH="/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8/bin:$PATH"
          
          cd c
          
          # 1. Build the target-specific CUDA backend DLL
          make cuda-dll CUDA_ARCH=${{ matrix.cuda_arch }}
          
          # 2. Build engines linked with the CUDA dynamic loader
          for t in colibri inkling kimi_k3 olmoe qwen36; do
            make $t.exe CUDA_DLL=1 ARCH=x86-64-v3
          done
          
          # 3. Build DeepSeek V4 engine
          make deepseek-v4 CUDA_DLL=1 ARCH=x86-64-v3
          
          ls -lh *.exe coli_cuda.dll

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          ls -lh dist/index.html dist/experts.json

      - name: Package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          
          # Copy executables & CUDA DLL
          cp c/colibri.exe dist/colibri.exe
          cp c/inkling.exe dist/inkling.exe
          cp c/kimi_k3.exe dist/kimi_k3.exe
          cp c/olmoe.exe dist/olmoe.exe
          cp c/qwen36.exe dist/qwen36.exe
          cp c/deepseek_v4.exe dist/deepseek_v4.exe
          cp c/coli_cuda.dll dist/coli_cuda.dll

          # Copy tools, Python launchers, and web dist
          mkdir -p dist/tools
          cp c/tools/k3_tokenizer.py dist/tools/
          cp c/coli dist/
          cp c/version.py dist/
          cp c/openai_server.py dist/
          cp c/v4_dsml.py dist/
          cp c/family_registry.py dist/
          cp c/resource_plan.py dist/
          cp c/doctor.py dist/
          cp c/autotune.py dist/
          cp LICENSE dist/
          
          mkdir -p dist/web
          cp -r web/dist dist/web/dist
          
          cd dist
          7z a colibri-${TAG}-${{ matrix.arch_name }}.zip *

      - name: Verify the packaged archive actually runs
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p verify && cd verify
          7z x ../dist/colibri-${TAG}-${{ matrix.arch_name }}.zip > /dev/null
          
          test -x colibri.exe || { echo "engine missing from archive"; ls -la; exit 1; }
          test -f coli_cuda.dll || { echo "FAIL: coli_cuda.dll missing from archive"; exit 1; }

          SIBLINGS="inkling kimi_k3 olmoe qwen36 deepseek_v4"
          for e in $SIBLINGS; do
            test -x $e.exe || { echo "FAIL: $e missing from archive"; ls -la; exit 1; }
          done

          test -f tools/k3_tokenizer.py || { echo "FAIL: k3_tokenizer.py missing from archive"; exit 1; }
          python3 -c "import ast; ast.parse(open('tools/k3_tokenizer.py', encoding='utf-8').read())" || exit 1

          COLI_EXPECT="$SIBLINGS" python3 - <<'PYCHK'
          import importlib.machinery, importlib.util, json, os, sys, tempfile
          from family_registry import all_families
          exe = ".exe"
          expect = os.environ["COLI_EXPECT"].split()

          missing = [n for n in expect if not os.path.exists(os.path.join(".", n + exe))]
          if missing:
              sys.exit("FAIL: engines missing: " + ", ".join(missing))

          loader = importlib.machinery.SourceFileLoader("coli_pkg", "coli")
          spec = importlib.util.spec_from_loader(loader.name, loader)
          cli = importlib.util.module_from_spec(spec)
          loader.exec_module(cli)

          bad = []
          for family in all_families():
            model_type = family.model_types[0]
            label = family.display_name
            with tempfile.TemporaryDirectory() as d:
                with open(os.path.join(d, "config.json"), "w", encoding="utf-8") as f:
                    json.dump({"model_type": model_type}, f)
                open(os.path.join(d, "tokenizer.json"), "w").close()
                engine = os.path.basename(cli.engine_for(d))
                arch = cli.model_arch(d)
            expected_file = family.engine_artifact + exe
            if not os.path.exists(expected_file):
              bad.append("%s: expected artifact %s is absent" % (label, expected_file))
            elif arch != family.id or engine != expected_file:
              bad.append("%s (%s) -> %s/%s, expected %s/%s" % (label, model_type, arch, engine, family.id, expected_file))
          if bad:
              sys.exit("FAIL: packaged launcher misroutes:\n  " + "\n  ".join(bad))
          print("OK: every CUDA engine is packaged AND coli dispatches to it:", " ".join(expect))
          PYCHK

      - uses: actions/upload-artifact@v4
        with:
          name: colibri-${{ matrix.arch_name }}
          path: dist/colibri-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          (cd artifacts && sha256sum colibri-*) > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

          NOTES=$(awk "/^## \\[${TAG#v}\\]/{found=1;next} /^## \\[/{if(found)exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "colibri ${TAG}" \
              --notes "$NOTES"
          fi
