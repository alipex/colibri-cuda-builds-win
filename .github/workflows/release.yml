name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "sm_61"
            arch_name: "win-cuda-pascal-gtx10"

    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # MSYS2 / MinGW
      # ------------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs

      - name: Add MSYS2 to PATH
        shell: pwsh
        run: |
          "C:\msys64\usr\bin" >> $env:GITHUB_PATH
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      # ------------------------------------------------------------
      # CUDA 12.4
      # ------------------------------------------------------------
      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'

      # ------------------------------------------------------------
      # Visual Studio 2022
      #
      # CUDA 12.4 needs the VS 2022/MSVC 193x toolchain.
      # ------------------------------------------------------------
      - name: Find Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -version "[17.0,18.0)" `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio 2022 with MSVC C++ tools was not found."
          }

          "VS_PATH=$vsPath" >> $env:GITHUB_ENV

          Write-Host "Visual Studio 2022 found at:"
          Write-Host $vsPath

      # ------------------------------------------------------------
      # Verify toolchain
      # ------------------------------------------------------------
      - name: Verify build toolchain
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          echo ===== MSVC =====
          where cl
          cl

          echo ===== CUDA =====
          where nvcc
          nvcc --version

          echo ===== MSYS2 =====
          where make
          where sh
          where gcc

          make --version
          gcc --version

      # ------------------------------------------------------------
      # Build CUDA backend
      # ------------------------------------------------------------
      - name: Build CUDA DLL
        shell: cmd
        working-directory: c
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          make cuda-dll CUDA-ARCH=${{ matrix.cuda_arch }}

      # ------------------------------------------------------------
      # Build Windows executable
      # ------------------------------------------------------------
      - name: Build Colibri
        shell: cmd
        working-directory: c
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          make colibri.exe CUDA_DLL=1 ARCH=native

      # ------------------------------------------------------------
      # Build IO benchmark
      # ------------------------------------------------------------
      - name: Build IO benchmark
        shell: cmd
        working-directory: c
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          make iobench.exe

      # ------------------------------------------------------------
      # Verify native build artifacts
      # ------------------------------------------------------------
      - name: Verify build artifacts
        shell: pwsh
        run: |
          $required = @(
            "c\colibri.exe",
            "c\coli_cuda.dll",
            "c\iobench.exe"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "FAIL: Missing build artifact: $file"
            }

            $size = (Get-Item $file).Length

            if ($size -le 0) {
              throw "FAIL: Empty build artifact: $file"
            }

            Write-Host "OK: $file ($size bytes)"
          }

      # ------------------------------------------------------------
      # Node / Web Dashboard
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard
        shell: pwsh
        run: |
          if ((Test-Path "web") -and (Test-Path "web/package.json")) {
            Push-Location web

            npm ci
            npm run build

            Pop-Location
          }
          else {
            Write-Host "Web dashboard not present; skipping."
          }

      # ------------------------------------------------------------
      # Package Release
      # ------------------------------------------------------------
      - name: Package Release
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF}"

          if ($tag -match '^refs/tags/(.+)$') {
            $tag = $Matches[1]
          }
          else {
            $tag = "latest"
          }

          $dist = Join-Path $PWD "dist"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dist | Out-Null
          New-Item -ItemType Directory -Path "$dist\tools" | Out-Null

          # Core Windows binaries
          Copy-Item "c\colibri.exe" "$dist\"
          Copy-Item "c\coli_cuda.dll" "$dist\"

          # IO benchmark
          Copy-Item "c\iobench.exe" "$dist\"

          # Core Python tools
          if (Test-Path "c\tools") {
            Get-ChildItem "c\tools\*.py" -ErrorAction SilentlyContinue |
              Copy-Item -Destination "$dist\tools\"
          }

          # Optional support files
          if (Test-Path "c\coli") {
            Copy-Item "c\coli" "$dist\"
          }

          Get-ChildItem "c\*.py" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "$dist\"

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$dist\"
          }

          # Web dashboard
          if (Test-Path "web\dist") {
            New-Item -ItemType Directory -Path "$dist\web" | Out-Null

            Copy-Item `
              "web\dist" `
              "$dist\web\dist" `
              -Recurse
          }

          # Create ZIP
          $zipName = "colibri-$tag-${{ matrix.arch_name }}.zip"
          $zipPath = Join-Path $PWD "dist\$zipName"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "$dist\*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Created:"
          Write-Host $zipPath
          Write-Host ""

          Get-Item $zipPath | Format-List Name, Length, FullName

      # ------------------------------------------------------------
      # Verify ZIP
      # ------------------------------------------------------------
      - name: Verify Package Contents
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF}"

          if ($tag -match '^refs/tags/(.+)$') {
            $tag = $Matches[1]
          }
          else {
            $tag = "latest"
          }

          $zip = "dist\colibri-$tag-${{ matrix.arch_name }}.zip"

          if (-not (Test-Path $zip)) {
            throw "FAIL: Release ZIP was not created: $zip"
          }

          $verify = Join-Path $PWD "verify"

          if (Test-Path $verify) {
            Remove-Item $verify -Recurse -Force
          }

          New-Item -ItemType Directory -Path $verify | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $verify `
            -Force

          $required = @(
            "colibri.exe",
            "coli_cuda.dll",
            "iobench.exe"
          )

          foreach ($file in $required) {
            $path = Join-Path $verify $file

            if (-not (Test-Path $path)) {
              throw "FAIL: $file missing from package"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Package contents:"
          Get-ChildItem $verify -Recurse

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: colibri-${{ matrix.arch_name }}
          path: dist/colibri-*.zip
          if-no-files-found: error

  # ==================================================================
  # GitHub Release
  # ==================================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # ------------------------------------------------------------
      # Checksums
      # ------------------------------------------------------------
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts

          sha256sum colibri-*.zip > SHA256SUMS.txt

          echo "SHA256SUMS:"
          cat SHA256SUMS.txt

      # ------------------------------------------------------------
      # Release notes
      # ------------------------------------------------------------
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          NOTES="Release ${TAG}"

          if [ -f CHANGELOG.md ]; then
            EXTRACTED=$(awk \
              "/^## \\[${TAG#v}\\]/{found=1;next} /^## \\[/{if(found)exit} found{print}" \
              CHANGELOG.md)

            if [ -n "$EXTRACTED" ]; then
              NOTES="$EXTRACTED"
            fi
          fi

          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Create / update GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          echo "Publishing release ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; uploading artifacts."

            gh release upload \
              "$TAG" \
              artifacts/* \
              --clobber
          else
            echo "Creating new release."

            gh release create \
              "$TAG" \
              artifacts/* \
              --title "colibri ${TAG}" \
              --notes "${{ steps.notes.outputs.notes }}"
          fi
