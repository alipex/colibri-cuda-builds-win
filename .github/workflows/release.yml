name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "sm_61"
            arch_name: "win-cuda-pascal-gtx10"
          - cuda_arch: "sm_70"
            arch_name: "win-cuda-volta-v100"
          - cuda_arch: "sm_75"
            arch_name: "win-cuda-turing-rtx20"
          - cuda_arch: "sm_80"
            arch_name: "win-cuda-ampere-a100"
          - cuda_arch: "sm_86"
            arch_name: "win-cuda-ampere-rtx30"
          - cuda_arch: "sm_89"
            arch_name: "win-cuda-ada-rtx40"
          - cuda_arch: "sm_120"
            arch_name: "win-cuda-blackwell-rtx50"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Build Qwen 3.6 Engine & CUDA Backend (Cross-Compile for Windows)
        run: |
          cd c
          
          # Cross-compile CUDA DLL for Windows target using Linux CUDA toolkit + MinGW host compiler
          make cuda-dll \
            CUDA_ARCH=${{ matrix.cuda_arch }} \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            NVCC="nvcc -ccbin x86_64-w64-mingw32-g++"
          
          # Cross-compile Qwen 3.6 engine executable targeting Windows
          make qwen36.exe \
            CUDA_DLL=1 \
            ARCH=x86-64-v3 \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++
          
          ls -lh qwen36.exe coli_cuda.dll

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard
        run: |
          cd web
          npm ci
          npm run build
          ls -lh dist/index.html dist/experts.json

      - name: Package Release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          
          # Copy Qwen 3.6 engine binary and CUDA loader library
          cp c/qwen36.exe dist/qwen36.exe
          cp c/coli_cuda.dll dist/coli_cuda.dll

          # Copy core tools and utilities
          mkdir -p dist/tools
          cp c/tools/k3_tokenizer.py dist/tools/
          cp c/coli dist/
          cp c/version.py dist/
          cp c/openai_server.py dist/
          cp c/v4_dsml.py dist/
          cp c/family_registry.py dist/
          cp c/resource_plan.py dist/
          cp c/doctor.py dist/
          cp c/autotune.py dist/
          cp LICENSE dist/
          
          # Copy Web Dashboard Assets
          mkdir -p dist/web
          cp -r web/dist dist/web/dist
          
          # Archive package into zip format
          cd dist
          7z a colibri-qwen36-${TAG}-${{ matrix.arch_name }}.zip *

      - name: Verify Package Contents
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p verify && cd verify
          7z x ../dist/colibri-qwen36-${TAG}-${{ matrix.arch_name }}.zip > /dev/null
          
          test -f qwen36.exe || { echo "FAIL: qwen36.exe missing"; exit 1; }
          test -f coli_cuda.dll || { echo "FAIL: coli_cuda.dll missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: colibri-qwen36-${{ matrix.arch_name }}
          path: dist/colibri-qwen36-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          (cd artifacts && sha256sum colibri-qwen36-*) > artifacts/SHA256SUMS.txt

          NOTES=$(awk "/^## \\[${TAG#v}\\]/{found=1;next} /^## \\[/{if(found)exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG} (Qwen 3.6 Engine)"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "colibri ${TAG} (Qwen 3.6 Engine)" \
              --notes "$NOTES"
          fi
